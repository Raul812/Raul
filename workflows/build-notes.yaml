name: Build Notes Index

on:
  push:
    branches: [main]
    paths:
      - 'notes/**.md'
      - 'notes/**.markdown'
      - 'scripts/build-notes.js'
      - '.github/workflows/build-notes.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build notes.json
        run: node scripts/build-notes.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notes.json
          git diff --staged --quiet || git commit -m "chore: rebuild notes.json"
          git push